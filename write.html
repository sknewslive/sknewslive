<style>
:root{--header-height:65px;--footer-height:80px;--container-width:1000px;--primary:#c8102e;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;width:100%;min-height:100%;font-family:"Noto Sans Bengali",Arial,sans-serif;background:#f5f6fa;color:#222;}
body{display:flex;flex-direction:column;min-height:100vh;}
#headerFrame{position:fixed;top:0;left:0;width:100%;height:var(--header-height);border:0;z-index:9999;background:#fff;}
.main-wrapper{width:100%;padding-top:calc(var(--header-height)+30px);padding-bottom:30px;display:flex;justify-content:center;flex:1 0 auto;}

hr{border:0;border-top:1px solid #eee;margin:20px 0;}
#userInfo{text-align:center;background:#f8f8f8;border-radius:8px;padding:10px;color:#555;font-size:14px;margin-bottom:15px;}
.form-group{margin-bottom:15px;}
label{display:block;margin-bottom:6px;color:#333;font-size:15px;font-weight:600;}
input,select,textarea{width:100%;padding:13px 14px;border:2px solid #ddd;border-radius:8px;outline:none;font-family:"Noto Sans Bengali",Arial,sans-serif;font-size:17px;background:#fff;transition:.2s;}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(200,16,46,.08);}
textarea{min-height:500px;resize:vertical;line-height:1.9;}

.btn-group{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px;}
button{border:0;padding:14px 15px;border-radius:8px;font-family:"Noto Sans Bengali",Arial,sans-serif;font-size:16px;font-weight:700;cursor:pointer;transition:.2s;}
button:hover{transform:translateY(-1px);}
button:disabled{opacity:.6;cursor:not-allowed;transform:none;}
.btn-view{background:#555;color:#fff;}
.btn-draft{background:#ffc107;color:#222;}
.btn-publish{background:var(--primary);color:#fff;}
.btn-logout{width:100%;margin-top:15px;background:#6c757d;color:#fff;}
#msg{display:none;margin-top:15px;padding:13px;border-radius:8px;text-align:center;font-size:15px;font-weight:600;}
.msg-success{display:block !important;background:#d1e7dd;color:#0f5132;}
.msg-error{display:block !important;background:#f8d7da;color:#842029;}
.msg-loading{display:block !important;background:#e9ecef;color:#495057;}
#pageLoading{width:100%;max-width:var(--container-width);margin:0 15px;background:#fff;border-radius:12px;padding:50px 20px;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.08);}
.loading-title{font-size:20px;font-weight:700;color:#555;}
.loading-text{margin-top:8px;color:#888;font-size:14px;}
#fatalError{display:none;width:100%;max-width:var(--container-width);margin:0 15px;background:#fff;border-radius:12px;padding:30px 20px;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.08);}
#errorText{color:#c8102e;font-size:15px;line-height:1.8;}
#footerFrame{width:100%;height:var(--footer-height);border:0;display:block;flex-shrink:0;}
@media(min-width:769px){body{padding-bottom:var(--footer-height);}#footerFrame{position:fixed;bottom:0;left:0;z-index:100;}}
@media(max-width:768px){:root{--header-height:65px;--footer-height:250px;}.main-wrapper{padding-top:calc(var(--header-height)+20px);padding-bottom:25px;}.container{width:calc(100% - 16px);padding:18px;margin:0 8px;}.page-title{font-size:23px;}input,select,textarea{font-size:16px;}textarea{min-height:450px;}.btn-group{grid-template-columns:1fr;}button{width:100%;}#footerFrame{position:relative;height:var(--footer-height);}}
@media(max-width:400px){.container{width:calc(100% - 10px);padding:14px;margin:0 5px;}.page-title{font-size:21px;}textarea{min-height:400px;}}
</style>
</head><body><iframe src="header.html" id="headerFrame" title="Header"></iframe><div class="main-wrapper"><div id="pageLoading"><div class="loading-title"> ⏳ পেজ লোড হচ্ছে... </div><div class="loading-text"> আপনার Login তথ্য যাচাই করা হচ্ছে </div></div><div id="fatalError"><h2> ❌ পেজ লোড করতে সমস্যা হয়েছে </h2><p id="errorText"></p><button type="button" class="btn-publish" onclick="location.reload()"> 🔄 আবার চেষ্টা করুন </button></div><div class="container" id="articleContainer" style="display:none;" ><h1 class="page-title"> ✍️ নতুন আর্টিকেল </h1><p class="page-subtitle"> SK News Live-এ নতুন সংবাদ প্রকাশ করুন </p><div id="userInfo"> Login তথ্য লোড হচ্ছে... </div><hr><form id="articleForm"><div class="form-group"><label for="title"> 📰 আর্টিকেলের টাইটেল * </label><input type="text" id="title" placeholder="আর্টিকেলের টাইটেল লিখুন..." autocomplete="off" required ></div><div class="form-group"><label for="category"> 📂 ক্যাটাগরি * </label><select id="category" required ><option value=""> ক্যাটাগরি নির্বাচন করুন </option><option value="জাতীয়"> জাতীয় </option><option value="রাজনীতি"> রাজনীতি </option><option value="আন্তর্জাতিক"> আন্তর্জাতিক </option><option value="বিনোদন"> বিনোদন </option><option value="টেক"> টেক </option><option value="লাইফস্টাইল"> লাইফস্টাইল </option><option value="খেলা"> খেলা </option></select></div><div class="form-group"><label for="content"> 📝 আর্টিকেল * </label><textarea id="content" placeholder="এখানে আপনার সম্পূর্ণ আর্টিকেল লিখুন..." required dir="auto" ></textarea></div><div class="form-group"><label for="img"> 🖼️ কভার ছবি * </label><input type="file" id="img" accept="image/*" required ><img id="preview" alt="Article Preview" ></div><div class="btn-group"><button type="button" class="btn-view" id="viewBtn" > 👁️ View </button><button type="button" class="btn-draft" id="draftBtn" > 📝 Draft </button><button type="button" class="btn-publish" id="publishBtn" > 🚀 Publish </button></div><button type="button" class="btn-logout" id="logoutBtn" > 🚪 Logout </button><div id="msg"></div></form></div></div><iframe src="footer.html" id="footerFrame" title="Footer"></iframe>
<script>
const SUPABASE_URL =
'https://nsjeprihgudhiczefopu.supabase.co';
const SUPABASE_KEY =
'sb_publishable_Q_0XpNcY3YcWK-1ZPTIbUg_dcUJOIJ0';
const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);
console.log('Supabase Client Ready');
</script>
<script>
/* =====================================================
   CLOUDINARY
===================================================== */
const CLOUD_NAME =
"sknewslive";
const UPLOAD_PRESET =
"sk_news_upload";
/* =====================================================
   SUPABASE CLIENT
===================================================== */
let client;
let currentUser = null;
/* =====================================================
   DOM READY
===================================================== */
document.addEventListener(
    "DOMContentLoaded",
    initPage
);
/* =====================================================
   INITIALIZE
===================================================== */
async function initPage(){
    try{
    /* Supabase library check */
    if(!window.supabase){
    throw new Error(
    "Supabase library load হয়নি। Internet connection চেক করুন।"
    );
    }
    /* Create client */
    client =
    window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
    );
    /* Check login */
    const {
    data,
    error
    } =
    await client.auth.getSession();
    if(error){
    throw error;
    }
    const session =
    data?.session;
    /* =================================================
    NOT LOGGED IN
    ================================================= */
    if(!session){
    showMessage(
    "Login করা নেই। Login পেজে নেওয়া হচ্ছে...",
    "loading"
    );
    setTimeout(
    function(){
    window.location.href =
    "login.html?redirect=Write.html";
    },
    700
    );
    return;
    }
    /* =================================================
    USER FOUND
    ================================================= */
    currentUser =
    session.user;
    document.getElementById(
    "userInfo"
    ).innerHTML =
    `
    ✅ Login করা হয়েছে:
    <strong>
    ${escapeHTML(currentUser.email || "User")}
    </strong>
    `;
    /* Show article page */
    document.getElementById(
    "pageLoading"
    ).style.display =
    "none";
    document.getElementById(
    "articleContainer"
    ).style.display =
    "block";
    /* Auth state listener */
    client.auth.onAuthStateChange(
    function(event, session){
    if(
    event === "SIGNED_OUT"
    ){
    window.location.href =
    "login.html?redirect=Write.html";
    }
    }
    );
    }
    catch(error){
    console.error(
    "Write page error:",
    error
    );
    showFatalError(
    error.message ||
    "Unknown error"
    );
    }
}
/* =====================================================
   SHOW FATAL ERROR
===================================================== */
function showFatalError(message){
    document.getElementById(
    "pageLoading"
    ).style.display =
    "none";
    document.getElementById(
    "articleContainer"
    ).style.display =
    "none";
    document.getElementById(
    "fatalError"
    ).style.display =
    "block";
    document.getElementById(
    "errorText"
    ).textContent =
    message;
}
/* =====================================================
   MESSAGE
===================================================== */
function showMessage(
    text,
    type
){
    const msg =
    document.getElementById("msg");
    msg.className = "";
    msg.textContent =
    text;
    msg.style.display =
    "block";
    if(type === "success"){
    msg.classList.add(
    "msg-success"
    );
    }
    else if(type === "error"){
    msg.classList.add(
    "msg-error"
    );
    }
    else{
    msg.classList.add(
    "msg-loading"
    );
    }
}
/* =====================================================
   ESCAPE HTML
===================================================== */
function escapeHTML(text){
    const div =
    document.createElement("div");
    div.textContent =
    text || "";
    return div.innerHTML;
}
/* =====================================================
   IMAGE PREVIEW
===================================================== */
document.getElementById(
    "img"
).addEventListener(
    "change",
    function(event){
    const file =
    event.target.files[0];
    if(!file){
    document.getElementById(
    "preview"
    ).style.display =
    "none";
    return;
    }
    if(
    !file.type.startsWith("image/")
    ){
    showMessage(
    "❌ শুধুমাত্র Image File নির্বাচন করুন।",
    "error"
    );
    event.target.value =
    "";
    return;
    }
    const preview =
    document.getElementById(
    "preview"
    );
    preview.src =
    URL.createObjectURL(file);
    preview.style.display =
    "block";
    }
);
/* =====================================================
   PREVIEW ARTICLE
===================================================== */
document.getElementById(
    "viewBtn"
).addEventListener(
    "click",
    previewArticle
);
function previewArticle(){
    const title =
    document.getElementById(
    "title"
    ).value.trim();
    const category =
    document.getElementById(
    "category"
    ).value;
    const content =
    document.getElementById(
    "content"
    ).value.trim();
    const file =
    document.getElementById(
    "img"
    ).files[0];
    if(!title){
    alert(
    "প্রথমে টাইটেল লিখুন।"
    );
    return;
    }
    const imageURL =
    document.getElementById(
    "preview"
    ).src;
    const previewWindow =
    window.open(
    "",
    "_blank"
    );
    if(!previewWindow){
    alert(
    "Browser popup block করেছে। Popup allow করুন।"
    );
    return;
    }
    previewWindow.document.write(
    `
    <!DOCTYPE html>
    <html lang="bn">
    <head>
    <meta charset="UTF-8">
    <meta
    name="viewport"
    content="width=device-width,initial-scale=1.0"
    >
    <title>
    ${escapeHTML(title)}
    </title>
    <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;700&display=swap"
    rel="stylesheet"
    >
    <style>
body{font-family:"Noto Sans Bengali",Arial;max-width:900px;margin:auto;padding:20px;line-height:1.9;}
h1{font-size:32px;}
.category{display:inline-block;background:#c8102e;color:#fff;padding:4px 12px;border-radius:4px;}
img{width:100%;max-height:550px;object-fit:cover;border-radius:10px;margin:20px 0;}
.content{white-space:pre-wrap;font-size:18px;}
</style>
</head><body><span class="category"> ${escapeHTML(category)} </span><h1> ${escapeHTML(title)} </h1> ${ file && imageURL ? `<img src="${imageURL}">` : "" } <div class="content"> ${escapeHTML(content)} </div></body></html> ` ); previewWindow.document.close(); } /* ===================================================== DRAFT ===================================================== */ document.getElementById( "draftBtn" ).addEventListener( "click", function(){ uploadAndSave( "draft" ); } ); /* ===================================================== PUBLISH ===================================================== */ document.getElementById( "publishBtn" ).addEventListener( "click", function(){ uploadAndSave( "published" ); } ); /* ===================================================== SAVE ARTICLE ===================================================== */ async function uploadAndSave(status){ if(!currentUser){ showMessage( "❌ Login session পাওয়া যায়নি।", "error" ); return; } const title = document.getElementById( "title" ).value.trim(); const category = document.getElementById( "category" ).value; const content = document.getElementById( "content" ).value.trim(); const file = document.getElementById( "img" ).files[0]; /* Validation */ if(!title){ showMessage( "❌ টাইটেল লিখুন।", "error" ); return; } if(!category){ showMessage( "❌ ক্যাটাগরি নির্বাচন করুন।", "error" ); return; } if(!content){ showMessage( "❌ আর্টিকেল লিখুন।", "error" ); return; } if(!file){ showMessage( "❌ কভার ছবি নির্বাচন করুন।", "error" ); return; } /* Buttons */ const publishBtn = document.getElementById( "publishBtn" ); const draftBtn = document.getElementById( "draftBtn" ); const viewBtn = document.getElementById( "viewBtn" ); publishBtn.disabled = true; draftBtn.disabled = true; viewBtn.disabled = true; publishBtn.innerHTML = "⏳ সেভ হচ্ছে..."; showMessage( status === "published" ? "⏳ Article Publish হচ্ছে..." : "⏳ Draft সেভ হচ্ছে...", "loading" ); try{ /* ================================================= CLOUDINARY UPLOAD ================================================= */ const formData = new FormData(); formData.append( "file", file ); formData.append( "upload_preset", UPLOAD_PRESET ); formData.append( "folder", "sk_news_live" ); const cloudResponse = await fetch( `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { method:"POST", body:formData } ); const cloudData = await cloudResponse.json(); if(!cloudResponse.ok){ throw new Error( cloudData?.error?.message || "Cloudinary image upload failed" ); } if( !cloudData.secure_url ){ throw new Error( "Image URL পাওয়া যায়নি।" ); } const image_url = cloudData.secure_url; /* ================================================= INSERT INTO SUPABASE ================================================= */ const { data, error } = await client .from("articles") .insert([ { title:title, category:category, content:content, image_url:image_url, author_id:currentUser.id, status:status } ]) .select(); if(error){ throw error; } console.log( "Article saved:", data ); /* ================================================= SUCCESS ================================================= */ showMessage( status === "published" ? "✅ Article সফলভাবে Publish হয়েছে!" : "✅ Draft সফলভাবে Save হয়েছে!", "success" ); /* Clear */ document.getElementById( "articleForm" ).reset(); document.getElementById( "preview" ).style.display = "none"; /* Redirect */ setTimeout( function(){ window.location.href = "index.html"; }, 1500 ); } catch(error){ console.error( "Save Article Error:", error ); showMessage( "❌ Error: " + (error.message || "Article save হয়নি"), "error" ); } finally{ publishBtn.disabled = false; draftBtn.disabled = false; viewBtn.disabled = false; publishBtn.innerHTML = "🚀 Publish"; } } /* ===================================================== LOGOUT ===================================================== */ document.getElementById( "logoutBtn" ).addEventListener( "click", async function(){ if(!client){ window.location.href = "login.html"; return; } const { error } = await client.auth.signOut(); if(error){ alert( "Logout সমস্যা: " + error.message ); return; } window.location.href = "login.html"; } ); </script></body></html>
