sW.style.display='none';hW.style.display='none';box.style.display='flex';
let {data:messages}=await sb.from('live_chat').select('*').order('created_at',{ascending:true}).limit(100);
let {data:presence}=await sb.from('user_presence').select('*').not('email','like','guest_%');
let pMap={};(presence||[]).forEach(p=>pMap[p.email]=p);
let online=presence?.filter(u=> new Date() - new Date(u.last_seen) < ONLINE_LIMIT_MS )||[];
let offline=presence?.filter(u=> new Date() - new Date(u.last_seen) >= ONLINE_LIMIT_MS )||[];
pd.getElementById('onlineCountTop').innerText=`• ${online.length} ${t('online')}, ${offline.length} ${t('offline')}`;
box.innerHTML='';(messages||[]).forEach(m=>{ if(m.email.includes('guest_')) return; let isMe=m.email===myEmail; let u=pMap[m.email]||{}; let dName=u.display_name||m.email.split('@')[0]; let aUrl=u.avatar_url||''; let av=aUrl?`<img src="${aUrl}">`:dName.charAt(0).toUpperCase(); let imgHtml=m.image_url?`<img src="${m.image_url}" onclick="window.open('${m.image_url}','_blank')">`:''; let row=pd.createElement('div'); row.className='skMsgRow'+(isMe?' me':''); row.innerHTML=`<div class="skAvatar">${av}</div><div class="skBubbleWrap"><div class="skName">${isMe?'You':dName} • ${m.email}</div><div class="skBubble ${isMe?'me':''}">${m.message||''}${imgHtml}</div></div>`; box.appendChild(row); });
}else if(cur==='message'){
hW.style.display='none';box.style.display='flex';sW.style.display='block';
let {data:presence}=await sb.from('user_presence').select('*').not('email','like','guest_%').order('last_seen',{ascending:false}).limit(100);
let online=presence?.filter(u=> new Date() - new Date(u.last_seen) < ONLINE_LIMIT_MS )||[];
let offline=presence?.filter(u=> new Date() - new Date(u.last_seen) >= ONLINE_LIMIT_MS )||[];
pd.getElementById('onlineCountTop').innerText=`• ${online.length} ${t('online')}, ${offline.length} ${t('offline')}`;
let searchVal=pd.getElementById('skSearch').value.toLowerCase();
let filtered=presence?.filter(u=>{ if(!searchVal) return true; return (u.display_name&&u.display_name.toLowerCase().includes(searchVal))||u.email.toLowerCase().includes(searchVal); })||[];
box.innerHTML=''; if(filtered.length===0){box.innerHTML=`<div style="text-align:center;padding:20px;font-size:10px">${t('noUser')}</div>`;return;}
filtered.forEach(u=>{ let isOn= new Date() - new Date(u.last_seen) < ONLINE_LIMIT_MS; let isMe=u.email===myEmail; let letter=(u.display_name||'U').charAt(0).toUpperCase(); let av=u.avatar_url?`<img src="${u.avatar_url}">`:letter; let div=pd.createElement('div'); div.className='skU'; div.innerHTML=`<div class="skAvatar">${av}</div><div style="flex:1;overflow:hidden"><div style="font-weight:700;font-size:11px">${u.display_name} ${isMe?'(You)':''}</div><div style="font-size:8px;color:#64748b">${u.email}</div></div><div style="text-align:right"><div style="font-size:14px">${isOn?'🟢':'⚪️'}</div><div style="font-size:7px;color:${isOn?'#16a34a':'#94a3b8'}">${isOn?t('online'):t('offline')}</div></div>`; box.appendChild(div); });
}else{
box.style.display='none';sW.style.display='none';hW.style.display='block';
hW.innerHTML=`<div style="padding:12px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:14px"><div style="flex:1;height:1px;background:#cbd5e1"></div><div style="font-weight:600;font-size:14px;color:#6b7280">${t('helpline')}</div><div style="flex:1;height:1px;background:#cbd5e1"></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><a href="https://wa.me/8801700000000" target="_blank" style="text-decoration:none;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:8px"><img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" style="width:42px;height:42px"><div style="font-weight:600;font-size:9px;color:#111">${t('wa')}</div></a><a href="https://t.me/yourusername" target="_blank" style="text-decoration:none;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:8px"><img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" style="width:42px;height:42px"><div style="font-weight:600;font-size:9px;color:#111">${t('tg')}</div></a><a href="https://m.me/sknewslivebd" target="_blank" style="text-decoration:none;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:8px"><img src="https://upload.wikimedia.org/wikipedia/commons/b/be/Facebook_Messenger_logo_2020.svg" style="width:42px;height:42px"><div style="font-weight:600;font-size:9px;color:#111">${t('ms')}</div></a><a href="https://www.facebook.com/sknewslivebd" target="_blank" style="text-decoration:none;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:8px"><img src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg" style="width:42px;height:42px"><div style="font-weight:600;font-size:9px;color:#111">${t('fb')}</div></a><a href="tel:+8801700000000" style="text-decoration:none;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:42px;height:42px;background:#dcfce7;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px">📞</div><div style="font-weight:600;font-size:9px;color:#111">${t('call')}</div></a><a href="mailto:support@sknewslive.com" style="text-decoration:none;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:42px;height:42px;background:#fef3c7;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px">✉️</div><div style="font-weight:600;font-size:9px;color:#111">${t('mail')}</div></a></div><div style="margin-top:14px;padding:10px;background:#f8fafc;border-radius:10px;text-align:center"><div style="font-size:9px;color:#64748b">${t('support')}</div><div style="font-size:10px;font-weight:700;color:#1e3a8a;margin-top:2px">support@sknewslive.com</div></div></div>`;
}
box.scrollTop=box.scrollHeight;
}
pd.getElementById('skFloatFinal').onclick=async()=>{let pp=pd.getElementById('skPopFinal');pp.classList.toggle('show');if(pp.classList.contains('show')){await heartbeat(); await loadChat();}};
pd.getElementById('skCloseF').onclick=()=>pd.getElementById('skPopFinal').classList.remove('show');
pd.getElementById('tHome').onclick=async function(){cur='home';pd.querySelectorAll('.skTab').forEach(t=>t.classList.remove('active'));this.classList.add('active');await loadChat();};
pd.getElementById('tHelp').onclick=function(){cur='help';pd.querySelectorAll('.skTab').forEach(t=>t.classList.remove('active'));this.classList.add('active');loadChat();};
pd.getElementById('tMsg').onclick=async function(){cur='message';pd.querySelectorAll('.skTab').forEach(t=>t.classList.remove('active'));this.classList.add('active');await loadChat();};
pd.getElementById('skSearch').oninput=()=>loadChat();
pd.getElementById('skSend').onclick=async()=>{let {email}=await getUserInfo();if(!email)return;let inp=pd.getElementById('skInp');if(!inp.value.trim())return;await sb.from('live_chat').insert([{email,message:inp.value}]);inp.value='';await loadChat();};
pd.getElementById('skImgBtn').onclick=()=>pd.getElementById('skFile').click();
pd.getElementById('skFile').onchange=async(e)=>{
  let file=e.target.files[0]; if(!file) return;
  let {email}=await getUserInfo(); if(!email) return;
  let btn=pd.getElementById('skImgBtn'); let old=btn.innerHTML; btn.innerHTML='⏳'; btn.disabled=true;
  try{ let url=await uploadToCloudinary(file); await sb.from('live_chat').insert([{email, message:'', image_url:url}]); await loadChat(); }catch(err){ alert('Upload failed: '+err.message); }
  btn.innerHTML=old; btn.disabled=false; e.target.value='';
};
sb.channel('chat').on('postgres_changes',{event:'INSERT',schema:'public',table:'live_chat'},()=>loadChat()).subscribe();
sb.channel('presence').on('postgres_changes',{event:'*',schema:'public',table:'user_presence'},()=>loadChat()).subscribe();
}catch(e){console.log(e)}
})();
</script></body></html>
